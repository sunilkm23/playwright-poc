name: Playwright Shard Tests GitHub Machines

on:
  # Allow manual triggering of the workflow
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        node-version: [22.x]
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (Shard ${{ matrix.shard }}/4)
        run: npx playwright test TestAutomationObstacle --project=chromium --shard=${{ matrix.shard }}/4

      - name: Upload blob report for shard ${{ matrix.shard }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: blob-report
          retention-days: 1

  merge-reports:
    name: Merge Playwright Reports
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports

      - name: List downloaded artifacts
        run: find all-blob-reports -type f

      - name: Reorganize blob reports for merging
        run: |
          mkdir -p blob-reports-merged
          find all-blob-reports -name "blob-report" -type d | while read dir; do
            cp -r "$dir"/* blob-reports-merged/ 2>/dev/null || true
          done
          find all-blob-reports -name "*.zip" -type f | while read file; do
            cp "$file" blob-reports-merged/
          done

      - name: Merge blob reports
        run: npx playwright merge-reports ./blob-reports-merged --reporter html,github

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: html-report-final
          path: playwright-report
